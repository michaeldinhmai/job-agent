version: 2
updates:
  # Python dependencies in requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  # The workflows above pin actions by major version tag; this keeps those
  # tags current so a known-bad action version doesn't linger in CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
